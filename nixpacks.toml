providers = ["php"]

[variables]
NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo_sqlite", "php84Extensions.sqlite3"]

[phases.install]
cmds = [
  "composer install --ignore-platform-req=php --optimize-autoloader --no-dev --no-interaction"
]

[phases.build]
cmds = [
  "touch database/database.sqlite",
  "php artisan migrate --force",
  "php artisan db:seed --force"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
